[DATABASE]
host = localhost
port = 5432
user = root
password = password
database = my_database

[MODEL]
architecture = resnet50
pretrained = true

[TRAINING]
epochs = 100
batch_size = 32
learning_rate = 0.001

[EVALUATION]
iou_threshold = 0.5
confidence_threshold = 0.5

[BASKETBALL]
# Player detection settings
player_detection_model = basketball-players-fy4c2/1
jersey_detection_model = basketball-player-detection-3-ycjdo/6
player_confidence_threshold = 0.3
jersey_confidence_threshold = 0.4

# Tracking settings
track_buffer = 30
match_threshold = 0.8
use_sam2 = false

# Team classification
use_siglip = true
team_classifier_batch_size = 32

# Jersey recognition
use_vlm_ocr = true
jersey_sample_interval = 5
stabilization_threshold = 3

[HOCKEY]
# RF-DETR Detection settings (Meta DINOv2 backbone)
use_rf_detr = true
rf_detr_model = rf-detr-medium
player_detection_model = hockey-players-puck/1
player_confidence_threshold = 0.35
goalie_confidence_threshold = 0.40
puck_confidence_threshold = 0.25

# Tracking settings (longer buffer for fast hockey movement)
player_track_buffer = 45
player_match_threshold = 0.75
puck_track_buffer = 60
puck_match_threshold = 0.5
use_sam2 = false

# Team classification
use_siglip = true
team_classifier_batch_size = 32

# Jersey recognition (less frequent sampling due to motion blur)
use_vlm_ocr = true
jersey_sample_interval = 8
stabilization_threshold = 4

# Hockey-specific features
enable_puck_tracking = true
enable_goalie_tracking = true
puck_velocity_smoothing = 5
trail_length = 30

[HOCKEY_ANALYTICS]
# Rink keypoint detection
keypoint_model = SimulaMet-HOST/HockeyRink
keypoint_confidence = 0.5
use_ransac_homography = true
enable_smoothing = true
smoothing_window = 5

# Position heatmap settings
heatmap_resolution_x = 100
heatmap_resolution_y = 43
heatmap_decay = 0.995
heatmap_sigma = 2.0

# Hotspot detection
hotspot_threshold = 0.7
min_hotspot_size = 5

# Zone analysis
blue_line_distance = 25.0
goal_line_distance = 89.0

# Position quality analysis
slot_width = 30.0
slot_depth = 25.0
inner_slot_width = 16.0
inner_slot_depth = 12.0

[HOCKEY_BETTING]
# Momentum tracking (frames)
momentum_window_short = 150
momentum_window_medium = 450
momentum_window_long = 900

# Signal thresholds
strong_signal_threshold = 0.7
lean_signal_threshold = 0.55

# xG calculation weights
slot_weight = 3.0
inner_slot_weight = 5.0
point_shot_weight = 1.0
rebound_bonus = 1.5

# Pressure thresholds
high_pressure_threshold = 0.7
low_pressure_threshold = 0.3

[HOCKEY_ADVANCED_ANALYTICS]
# Expected Threat (xT) settings
xt_grid_length = 20
xt_grid_width = 10
xt_convergence_threshold = 0.00001
xt_max_iterations = 100

# Zone Entry xT
zone_entry_blue_line_x = 175.0
zone_entry_lane_boundaries = 28.33, 56.67
zone_entry_speed_baseline = 15.0

# Shot Deception settings
shot_deception_decision_distance = 35.0
shot_deception_reaction_time = 0.175
shot_deception_min_shots = 20

# Line Chemistry GNN
passing_network_edge_threshold = 3
passing_motif_min_occurrences = 3
passing_motif_max_players = 4

# ACWR Fatigue settings
acwr_acute_window = 7
acwr_chronic_window = 28
acwr_ewma_decay = 0.1
acwr_use_ewma = true
acwr_high_risk_threshold = 1.5
acwr_moderate_risk_threshold = 1.3

# Goalie Save Difficulty
goalie_optimal_depth = 4.0
goalie_angle_tolerance = 5.0
goalie_screen_modifier = 0.15
goalie_rebound_modifier = 0.10

# Ice Control
ice_control_grid_x = 100
ice_control_grid_y = 43
ice_control_max_reach = 8.0
ice_control_reaction_time = 0.5
ice_control_max_speed = 30.0

# OBSO (Off-Ball Scoring Opportunities)
obso_attention_range = 15.0
obso_grid_resolution = 10
obso_danger_zone_x = 175.0

# Transition Analysis
rush_fast_transition_threshold = 3.0
rush_elite_speed_threshold = 20.0
rush_breakaway_base_rate = 0.33
rush_2on1_base_rate = 0.25
rush_3on2_base_rate = 0.20

# EPV (Expected Possession Value)
epv_grid_x = 40
epv_grid_y = 20
epv_shot_prob_weight = 0.3
epv_pass_value_weight = 0.4
epv_carry_value_weight = 0.3

# Shooter Gravity
gravity_attention_range = 15.0
gravity_close_range = 8.0
gravity_baseline = 0.5

# NHL API settings
nhl_api_base_url = https://api-web.nhle.com/v1
nhl_api_rate_limit = 0.5