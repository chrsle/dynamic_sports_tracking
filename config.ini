[DATABASE]
host = localhost
port = 5432
user = root
password = password
database = my_database

[MODEL]
architecture = resnet50
pretrained = true

[TRAINING]
epochs = 100
batch_size = 32
learning_rate = 0.001

[EVALUATION]
iou_threshold = 0.5
confidence_threshold = 0.5

[BASKETBALL]
# Player detection settings
player_detection_model = basketball-players-fy4c2/1
jersey_detection_model = basketball-player-detection-3-ycjdo/6
player_confidence_threshold = 0.3
jersey_confidence_threshold = 0.4

# Tracking settings
track_buffer = 30
match_threshold = 0.8
use_sam2 = false

# Team classification
use_siglip = true
team_classifier_batch_size = 32

# Jersey recognition
use_vlm_ocr = true
jersey_sample_interval = 5
stabilization_threshold = 3

[HOCKEY]
# RF-DETR Detection settings (Meta DINOv2 backbone)
use_rf_detr = true
rf_detr_model = rf-detr-medium
player_detection_model = hockey-players-puck/1
player_confidence_threshold = 0.35
goalie_confidence_threshold = 0.40
puck_confidence_threshold = 0.25

# Tracking settings (longer buffer for fast hockey movement)
player_track_buffer = 45
player_match_threshold = 0.75
puck_track_buffer = 60
puck_match_threshold = 0.5
use_sam2 = false

# Team classification
use_siglip = true
team_classifier_batch_size = 32

# Jersey recognition (less frequent sampling due to motion blur)
use_vlm_ocr = true
jersey_sample_interval = 8
stabilization_threshold = 4

# Hockey-specific features
enable_puck_tracking = true
enable_goalie_tracking = true
puck_velocity_smoothing = 5
trail_length = 30

[HOCKEY_ANALYTICS]
# Rink keypoint detection
keypoint_model = SimulaMet-HOST/HockeyRink
keypoint_confidence = 0.5
use_ransac_homography = true
enable_smoothing = true
smoothing_window = 5

# Position heatmap settings
heatmap_resolution_x = 100
heatmap_resolution_y = 43
heatmap_decay = 0.995
heatmap_sigma = 2.0

# Hotspot detection
hotspot_threshold = 0.7
min_hotspot_size = 5

# Zone analysis
blue_line_distance = 25.0
goal_line_distance = 89.0

# Position quality analysis
slot_width = 30.0
slot_depth = 25.0
inner_slot_width = 16.0
inner_slot_depth = 12.0

[HOCKEY_BETTING]
# Momentum tracking (frames)
momentum_window_short = 150
momentum_window_medium = 450
momentum_window_long = 900

# Signal thresholds
strong_signal_threshold = 0.7
lean_signal_threshold = 0.55

# xG calculation weights
slot_weight = 3.0
inner_slot_weight = 5.0
point_shot_weight = 1.0
rebound_bonus = 1.5

# Pressure thresholds
high_pressure_threshold = 0.7
low_pressure_threshold = 0.3