[DATABASE]
host = localhost
port = 5432
user = root
password = password
database = my_database

[MODEL]
architecture = resnet50
pretrained = true

[TRAINING]
epochs = 100
batch_size = 32
learning_rate = 0.001

[EVALUATION]
iou_threshold = 0.5
confidence_threshold = 0.5

[BASKETBALL]
# Player detection settings
player_detection_model = basketball-players-fy4c2/1
jersey_detection_model = basketball-player-detection-3-ycjdo/6
player_confidence_threshold = 0.3
jersey_confidence_threshold = 0.4

# Tracking settings
track_buffer = 30
match_threshold = 0.8
use_sam2 = false

# Team classification
use_siglip = true
team_classifier_batch_size = 32

# Jersey recognition
use_vlm_ocr = true
jersey_sample_interval = 5
stabilization_threshold = 3