version: '3.8'

services:
  hockey-analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hockey-analytics-dashboard
    ports:
      - "8000:8000"
    environment:
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - API_KEY=${API_KEY}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/app/dashboard/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - analytics-network

  # Optional: Redis for distributed rate limiting (production)
  # redis:
  #   image: redis:7-alpine
  #   container_name: hockey-analytics-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - analytics-network

volumes:
  uploads:
  # redis-data:

networks:
  analytics-network:
    driver: bridge
